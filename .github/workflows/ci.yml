name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race -count=2 ./...

      - name: build
        run: go build ./...

  crossbuild:
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first platform to fail cancels the rest and hides
      # whether the problem is one platform or all of them.
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Cross-compiling with cgo on would need a C toolchain per target;
          # this binary needs none, so turn it off rather than install six.
          CGO_ENABLED: '0'
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
          go build -trimpath -o "/tmp/clrfkd-${GOOS}-${GOARCH}" ./cmd/clrfkd
          ls -l "/tmp/clrfkd-${GOOS}-${GOARCH}"
